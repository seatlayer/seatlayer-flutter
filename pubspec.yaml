name: seatlayer
description: >-
  Flutter SDK for interactive seat maps and reserved seating charts on iOS and
  Android, with live availability, seat selection, temporary holds, and secure booking.
version: 0.2.1
homepage: https://seatlayer.io/developers/
repository: https://github.com/seatlayer/seatlayer-flutter
issue_tracker: https://github.com/seatlayer/seatlayer-flutter/issues
documentation: https://docs.seatlayer.io/buyer-sdk/flutter/

topics:
  - seat-map
  - seating-chart
  - reserved-seating
  - seat-picker
  - ticketing

screenshots:
  - description: >-
      SeatLayer Flutter reserved-seating chart running in the iOS example app.
    path: screenshots/flutter-seat-map-ios.png

platforms:
  android:
  ios:

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1

flutter:
  assets:
    - assets/seatlayer.js
    - assets/index.html
    - assets/demo.html
