name: seatlayer
description: >-
  Official Flutter SDK for embedding interactive SeatLayer reserved-seating
  maps with holds, best available, live events, and a versioned WebView bridge.
version: 0.1.0
homepage: https://seatlayer.io/developers/
repository: https://github.com/seatlayer/seatlayer-flutter
issue_tracker: https://github.com/seatlayer/seatlayer-flutter/issues
documentation: https://docs.seatlayer.io/buyer-sdk/mobile/

topics:
  - seat-map
  - reserved-seating
  - ticketing
  - webview
  - sdk

platforms:
  android:
  ios:

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1

flutter:
  assets:
    - assets/seatlayer.js
    - assets/index.html
    - assets/demo.html
