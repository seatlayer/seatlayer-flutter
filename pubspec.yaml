name: seatlayer
description: >-
  Flutter seat map SDK: a seating chart and seat picker for iOS and Android
  ticketing apps, with live availability, seat holds, season tickets, 3D views
  and secure checkout.
version: 0.14.1
homepage: https://docs.seatlayer.io/buyer-sdk/flutter/
repository: https://github.com/seatlayer/seatlayer-flutter
issue_tracker: https://github.com/seatlayer/seatlayer-flutter/issues
documentation: https://docs.seatlayer.io/buyer-sdk/flutter/

topics:
  - seat-map
  - seating-chart
  - seat-picker
  - reserved-seating
  - event-ticketing

screenshots:
  - description: >-
      The SeatLayer picker on a phone: the whole venue, a section, the seat
      card, the cart and the 3D venue.
    path: doc/media/picker-flow.gif
  - description: >-
      A section of the venue with the SeatLayer picker's price rail, map
      controls and cart.
    path: doc/media/picker-section.png
  - description: >-
      The Season picker: the package, its prices and dates, and the Choose
      seats button, under a Flutter header.
    path: doc/media/season-picker.png

platforms:
  android:
  ios:

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
  crypto: ^3.0.7
  # Both are already in the tree through `webview_flutter`; naming them lets the
  # tests install a recording WebView platform without an implicit dependency.
  plugin_platform_interface: ^2.1.8
  webview_flutter_platform_interface: ^2.14.0
