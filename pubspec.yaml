name: seatlayer
description: >-
  Flutter seat map SDK: a native seating chart and seat picker for iOS and
  Android ticketing apps, with live availability, best available, seat holds,
  3D views and secure checkout.
version: 0.8.0
homepage: https://docs.seatlayer.io/buyer-sdk/flutter/
repository: https://github.com/seatlayer/seatlayer-flutter
issue_tracker: https://github.com/seatlayer/seatlayer-flutter/issues
documentation: https://docs.seatlayer.io/buyer-sdk/flutter/

topics:
  - seat-map
  - seating-chart
  - seat-picker
  - reserved-seating
  - event-ticketing

screenshots:
  - description: >-
      The SeatLayer picker on a phone: venue overview, section dock, seat
      confirmation, ticket list and the 3D venue view.
    path: doc/media/picker-flow.gif
  - description: >-
      A focused section with the SeatLayer picker's dock bar and price legend.
    path: doc/media/picker-section.png

platforms:
  android:
  ios:

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
  crypto: ^3.0.7
  # Both are already in the tree through `webview_flutter`; naming them lets the
  # tests install a recording WebView platform without an implicit dependency.
  plugin_platform_interface: ^2.1.8
  webview_flutter_platform_interface: ^2.14.0
