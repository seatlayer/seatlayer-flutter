name: seatlayer_flutter
description: >-
  Flutter SDK for embedding SeatLayer interactive seat maps. Drives the vendored
  SeatLayer web widget inside a WebView over the shared, versioned bridge
  protocol. A Dart port of the proven iOS SDK.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1

flutter:
  assets:
    - assets/seatlayer.js
    - assets/index.html
    - assets/demo.html
