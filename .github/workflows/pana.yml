name: Package score

# Scores the package the way pub.dev does, before a release is tagged.
#
# pub.dev analyses every upload with the newest stable Flutter and its own
# lints, so it can report issues that ci.yml's pinned Flutter does not see
# (an import the newer SDK has deprecated, for one). Run this on the release
# head; it prints the full report and fails when any point is missing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          # Unpinned on purpose: the score is pub.dev's, which uses the
          # newest stable SDK.
          channel: stable
          cache: true
      - run: flutter --version
      # pana converts the README pictures with these, as pub.dev does; without
      # them the screenshot check fails.
      - run: sudo apt-get update && sudo apt-get install -y webp
      # Score what pub publishes, not the checkout: drop every tracked file
      # .pubignore leaves out of the archive (the tests, tools, design source).
      - run: git ls-files -z -c -i --exclude-from=.pubignore | xargs -0 rm -f
      - run: dart pub global activate pana
      - run: dart pub global run pana --exit-code-threshold 0 .
